<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Meseros · Toma de Órdenes</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- ================= HEADER ================= -->
<header class="app-header">
  <div class="brand">
    <i class="bi bi-shop-window"></i>
    <span>Meseros</span>
  </div>
  <div class="meta">
    <span class="badge" id="connBadge">
      <span class="dot"></span>
      <i class="bi bi-wifi"></i>
      <span id="connTxt">Online</span>
    </span>
    <span class="badge" id="meseroBadge" title="Mantén presionado para cambiar de mesero">
      <i class="bi bi-person-badge"></i>
      <span id="meseroNombre">—</span>
    </span>
  </div>
</header>

<!-- ================= BUSCADOR ================= -->
<div class="search-wrap">
  <div class="search-box">
    <i class="bi bi-search"></i>
    <input type="text" id="buscador" placeholder="Buscar platillo, bebida o complemento...">
  </div>
</div>

<!-- ================= CATEGORÍAS DESPLEGABLE ================= -->
<div class="cat-dropdown" id="catDropdown">
  <button class="cat-toggle" id="catToggle">
    <span class="left">
      <i class="bi bi-grid-3x3-gap"></i>
      <span id="catActual">Todas las categorías</span>
    </span>
    <i class="bi bi-chevron-down chevron"></i>
  </button>
  <div class="cat-menu" id="catMenu"></div>
</div>

<!-- ================= MENÚ ================= -->
<main id="menuContainer"></main>

<!-- ================= CARRITO FLOTANTE ================= -->
<div class="cart-bar">
  <div class="info">
    <div class="icon-circle">
      <i class="bi bi-receipt"></i>
      <span class="count" id="cartCount">0</span>
    </div>
    <div class="totales">
      <span class="lbl">Total orden</span>
      <span class="val" id="cartTotal">$0</span>
    </div>
  </div>
  <button class="btn-ver-orden" id="btnVerOrden">
    <i class="bi bi-list-check"></i> Ver orden
  </button>
</div>

<!-- ================= PANEL ORDEN ================= -->
<div class="overlay" id="overlayOrden">
  <div class="panel">
    <div class="panel-head">
      <h3><i class="bi bi-clipboard-check"></i> Orden actual</h3>
      <button id="btnCerrarOrden"><i class="bi bi-x-lg"></i></button>
    </div>
    <div class="panel-body" id="cartBody"></div>
    <div class="panel-foot">
      <div class="totales-panel">
        <div class="row"><span>Subtotal</span><span id="pSubtotal">$0</span></div>
        <div class="row"><span>Artículos</span><span id="pArticulos">0</span></div>
        <div class="row total"><span>TOTAL</span><span id="pTotal">$0</span></div>
      </div>
      <button class="btn-primary" id="btnEnviarCaja">
        <i class="bi bi-send-check"></i> Enviar orden a caja
      </button>
      <button class="btn-secondary" id="btnVaciar">
        <i class="bi bi-trash3"></i> Vaciar orden
      </button>
    </div>
  </div>
</div>

<!-- ================= MODAL IDENTIFICACIÓN ================= -->
<div class="modal-ident" id="modalIdent">
  <div class="box">
    <i class="bi bi-person-badge icon"></i>
    <h2>¿Quién toma la orden?</h2>
    <p>Escribe tu nombre para identificar tus órdenes en caja.</p>
    <input type="text" id="inputMesero" placeholder="Ej. Juan, María, Luis..." autocomplete="off" maxlength="30">
    <button class="btn-primary" id="btnGuardarMesero">
      <i class="bi bi-check-circle"></i> Comenzar a tomar órdenes
    </button>
  </div>
</div>

<!-- ================= TOAST ================= -->
<div class="toast" id="toast"><i class="bi bi-check-circle-fill"></i> <span id="toastMsg"></span></div>

<script src="script.js"></script>
</body>
</html>
